{% extends "base.html" %}
{% block title %}Register — MockLab{% endblock %}
{% block body %}
<div class="card">
  <h1>Create an account</h1>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="new-password" required>
    <div style="margin-top:16px"><button type="submit">Register</button></div>
  </form>
  <p class="muted" style="margin-top:14px">Already have an account?
     <a href="{{ url_for('login') }}">Log in</a>.</p>
</div>
{% endblock %}
